{% extends 'base.html' %}
{% block content %}
  <div class="min-h-screen bg-[#0E0E0E] text-[#E5E2E1] p-6 sm:p-12 lg:p-32">
    <!-- Header -->
    <div class="mb-10 lg:mb-16">
      <h1 class="text-4xl sm:text-5xl font-serif">{{ category.title }}</h1>
      <p class="text-sm text-[#D1C5B4] mt-3 tracking-wide max-w-md">{{ category.description }}</p>
    </div>

    <!-- Gallery Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-10">
      {% for image in images %}
        <div class="relative cursor-pointer group" onclick="openLightbox({{ forloop.counter0 }})">
          <!-- Image -->
          <img src="{{ image.image.url }}" class="w-full h-64 sm:h-[300px] object-cover rounded-md transition duration-500 group-hover:scale-[1.03]" />

          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-[#DDAD69] opacity-0 group-hover:opacity-[0.08] transition"></div>
        </div>
      {% endfor %}
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="fixed inset-0 bg-[#0E0E0E] hidden items-center justify-center z-50">
    <!-- Overlay Click Area (Zoom Cursor Effect) -->
    <div class="absolute inset-0 cursor-zoom-out" onclick="closeLightbox()"></div>

    <!-- Image Container -->
    <div class="relative z-10 flex items-center justify-center w-screen h-screen p-4 sm:p-10">
      <!-- Left Button -->
      <button onclick="prevImage()" class="absolute left-4 sm:left-10 text-[#D1C5B4] text-4xl sm:text-3xl hover:text-[#E8C176]">‹</button>

      <!-- Image -->
      <img id="lightbox-img" class="max-h-[90vh] max-w-[85vw] sm:max-w-none w-auto object-contain rounded-md shadow-xl" />

      <!-- Right Button -->
      <button onclick="nextImage()" class="absolute right-4 sm:right-10 text-[#D1C5B4] text-4xl sm:text-3xl hover:text-[#E8C176]">›</button>
    </div>

    <!-- Close Button -->
    <button onclick="closeLightbox()" class="absolute top-4 right-4 sm:top-8 sm:right-10 text-[#D1C5B4] text-2xl sm:text-3xl hover:text-[#E8C176] z-20">✕</button>
  </div>

  <script>
  const images = [
    {% for image in images %}
      "{{ image.image.url }}",
    {% endfor %}
  ];

  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    document.getElementById("lightbox").classList.remove("hidden");
    document.getElementById("lightbox").classList.add("flex");
    updateImage();
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.add("hidden");
    document.getElementById("lightbox").classList.remove("flex");
  }

  function updateImage() {
    document.getElementById("lightbox-img").src = images[currentIndex];
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
  }

  // Keyboard support (pro feel)
  document.addEventListener("keydown", function(e) {
    if (!document.getElementById("lightbox").classList.contains("hidden")) {
      if (e.key === "ArrowRight") nextImage();
      if (e.key === "ArrowLeft") prevImage();
      if (e.key === "Escape") closeLightbox();
    }
  });
</script>
{% endblock %}
