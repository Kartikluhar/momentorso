{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-[#0E0E0E] text-[#E5E2E1] p-32">

  <!-- Header -->
  <div class="mb-12">
    <h1 class="text-4xl font-serif">Add Category</h1>
    <p class="text-sm text-[#D1C5B4] mt-2 tracking-wide">
      Structure your gallery with curated categories
    </p>
  </div>

  <div class="grid lg:grid-cols-2 gap-16">

    <!-- FORM -->
    <div class="bg-[#1C1B1B] p-10 rounded-md relative">
      <div class="absolute inset-0 bg-[#DDAD69] opacity-[0.04] blur-3xl"></div>

      <form method="POST" enctype="multipart/form-data" class="relative z-10 space-y-8">
        {% csrf_token %}

        <h2 class="text-2xl font-semibold">Create Category</h2>

        <!-- Image -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">Image</label>
          <input type="file" name="image"
            class="w-full bg-[#2A2A2A] px-4 py-3 text-sm outline-none"  accept="image/*" required>
        </div>

        <!-- Title -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">Title</label>
          <input type="text" name="title"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]"
            placeholder="Enter title" required>
        </div>

        <!-- Description -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">Description</label>
          <textarea name="description"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]"
            rows="4"
            placeholder="Enter description"></textarea>
        </div>

        <!-- Button -->
        <button type="submit"
          class="w-full py-3 text-sm font-medium tracking-wide text-[#261900] rounded-md 
          bg-gradient-to-br from-[#E8C176] to-[#C9A45C] hover:scale-[1.02] transition">
          Create Category
        </button>

      </form>
    </div>


    <!-- TABLE -->
    <div class="bg-[#131313] p-10 rounded-md">

      <div class="mb-8">
        <h2 class="text-2xl font-semibold">Categories</h2>
      </div>

      <div class="space-y-4">

        <!-- Header -->
        <div class="grid grid-cols-4 text-xs text-[#4E4639] uppercase tracking-widest">
          <span>Image</span>
          <span>Title</span>
          <span>Actions</span>
          <span></span>
        </div>

        {% for category in categories %}
        <div class="grid grid-cols-4 items-center bg-[#1C1B1B] p-4 rounded-md hover:bg-[#2A2A2A] transition">

          <img src="{{ category.image.url }}" class="w-12 h-12 object-cover rounded">

          <span class="text-sm">{{ category.title }}</span>

          <div class="flex gap-4 text-sm">
            <a href="{% url "update_category" category.id %}" class="text-[#E8C176]">Update</a>
            <a href="{% url "delete_category" category.id %}" class="text-red-400">Delete</a>
          </div>

          <span></span>

        </div>
        {% endfor %}

      </div>
    </div>

  </div>
</div>
{% endblock %}
