{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-[#0E0E0E] text-[#E5E2E1] p-32">

  <!-- Header -->
  <div class="mb-12">
    <h1 class="text-4xl font-serif">Update Admin</h1>
    <p class="text-sm text-[#D1C5B4] mt-2 tracking-wide">
      Manage administrator access and permissions
    </p>
  </div>


  <!-- Form + Table Layout -->
  <div class="grid grid-cols-1 gap-16">

    <!-- LEFT: FORM -->
    <div class="bg-[#1C1B1B] p-10 rounded-md relative">

      <!-- Ambient Glow -->
      <div class="absolute inset-0 bg-[#DDAD69] opacity-[0.04] blur-3xl"></div>

      <form method="POST" class="relative z-10 space-y-8">
        {% csrf_token %}

        <!-- Title -->
        <h2 class="text-2xl font-semibold">Update Admin</h2>

        <!-- Username -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Username
          </label>
          <input 
            type="text" 
            name="username"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]"
            placeholder="Enter username"
            value="{{admin.username}}"
            required
          >
        </div>

        <!-- Email -->
        {% comment %} <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Email
          </label>
          <input 
            type="email" 
            name="email"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]"
            placeholder="Enter email"
            required
          >
        </div> {% endcomment %}

        <!-- Password -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Password
          </label>
          <input 
            type="password" 
            name="password"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]"
            placeholder="Enter password"
            required
          >
        </div>

        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Role
          </label>
          <select name="role" id="role" class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C]" required>
            {% for role in roles %}
              <option value="{{role}}">{{role}}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Button -->
        <button 
          type="submit"
          class="w-full py-3 text-sm font-medium tracking-wide text-[#261900] rounded-md 
                 bg-gradient-to-br from-[#E8C176] to-[#C9A45C] 
                 hover:scale-[1.02] transition-all duration-300">
          Update Admin
        </button>

      </form>

    </div>

  </div>

</div>
{% endblock %}
