{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-[#0E0E0E] text-[#E5E2E1] flex items-center justify-center px-6">

  <!-- Main Container -->
  <div class="w-full max-w-6xl grid md:grid-cols-2 gap-16 items-center">

    <!-- Left Side (Editorial Section) -->
    <div class="relative pt-20 md:pt-0">
      <h1 class="text-5xl md:text-6xl font-serif leading-tight">
        Admin <br />
        <span class="text-[#D1C5B4]">Access Portal</span>
      </h1>

      <p class="mt-6 text-sm tracking-wide text-[#D1C5B4] max-w-sm">
        Enter the atelier. Manage projects, curate galleries, and shape the digital presence with precision.
      </p>

      <!-- Decorative Offset Block (Intentional Asymmetry) -->
      <div class="absolute -bottom-10 left-10 w-32 h-32 bg-[#1C1B1B] rounded-xl blur-2xl opacity-40"></div>
    </div>

    <!-- Right Side (Login Form Card) -->
    <div class="bg-[#1C1B1B] p-10 rounded-md relative">

      <!-- Subtle Glow -->
      <div class="absolute inset-0 bg-[#DDAD69] opacity-[0.04] blur-3xl"></div>

      <form method="POST" class="relative z-10 space-y-8">
        {% csrf_token %}

        <!-- Title -->
        <div>
          <h2 class="text-2xl font-semibold tracking-wide">
            Sign In
          </h2>
          <p class="text-xs text-[#D1C5B4] mt-1 tracking-wide">
            Authorized personnel only
          </p>
        </div>

        <!-- Username -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Username
          </label>
          <input 
            type="text" 
            name="username"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C] transition-all"
            placeholder="Enter username"
          >
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="text-xs tracking-widest text-[#D1C5B4] uppercase">
            Password
          </label>
          <input 
            type="password" 
            name="password"
            class="w-full bg-[#2A2A2A] px-4 py-3 outline-none focus:border-b-2 border-[#C9A45C] transition-all"
            placeholder="Enter password"
          >
        </div>

        <!-- Button -->
        <div>
          <button 
            type="submit"
            class="w-full py-3 text-sm font-medium tracking-wide text-[#261900] rounded-md 
                   bg-gradient-to-br from-[#E8C176] to-[#C9A45C] 
                   hover:scale-[1.02] transition-all duration-300">
            Enter Dashboard
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
